# Publish autocatpath (and its catpath compat alias) to PyPI via Trusted
# Publishing (OIDC) — no API token needed.
#
# `autocatpath` is the canonical project name. We ALSO ship the same code under
# the legacy `catpath` name so existing `pip install catpath` users keep
# resolving to this package after the rename. Both are separate PyPI projects
# but share ONE trusted-publisher shape: repo retospect/catpath, this file
# (workflow.yml), environment `pypi`. Configure a trusted publisher with those
# values on BOTH the `autocatpath` and `catpath` PyPI projects. A single publish
# step uploads both distributions — PyPI matches each file to its own project by
# name.
#
# Trigger: publishing a GitHub Release.  Also runnable manually.
#
# One-time GitHub setup: create an Environment named `pypi`
# (Settings -> Environments) — it may be auto-created on first run.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build autocatpath sdist + wheel
        run: uv build
      - name: Build catpath compat-alias sdist + wheel
        # Same tree, PyPI project name overridden back to the legacy catpath
        # name so old installs keep working. Both name variants land in dist/.
        run: |
          sed -i 's/^name = "autocatpath"$/name = "catpath"/' pyproject.toml
          uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the "Environment name" set in the PyPI trusted publisher.
    environment: pypi
    permissions:
      id-token: write        # OIDC token for trusted publishing (no password/token)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
